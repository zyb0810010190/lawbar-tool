[mcp_servers.claude-reviewer]
command = "npx"
args    = ["-y", "claude-octopus@1.1.10"]
# env vars required — add [mcp_servers.claude-reviewer.env] manually:
# CLAUDE_ALLOWED_TOOLS = "<value>"
# CLAUDE_APPEND_PROMPT = "<value>"
# CLAUDE_DESCRIPTION = "<value>"
# CLAUDE_MODEL = "<value>"
# CLAUDE_SERVER_NAME = "<value>"
# CLAUDE_TOOL_NAME = "<value>"

