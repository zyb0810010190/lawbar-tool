name: Desktop release gates

# CI/release governance (WI-DESKTOP-CI-RELEASE-GATES-10): prove the desktop
# release path — unit/renderer/electron suite, unsigned packaged build, and the
# packaged M1-M9 smoke matrix — before merge. NO Apple signing/notarization in CI
# (default `dist` uses identity:null; no credentials are read or required). The
# separate `check-ui-design-artifact` workflow is unchanged.

on:
  pull_request:
    paths:
      - "apps/lawbar-desktop/**"
      # The desktop `pretest` chain runs `check:no-real-data:all` — the full-corpus
      # privacy scan whose party-name allowlist guards `docs/contracts/**/fixtures/**`.
      # Without this path, a PR touching ONLY a contract fixture would never fire the
      # very gate that protects it (WI-GATE-FULLSCAN, commit 6c8fe17).
      - "docs/contracts/**"
      - ".github/workflows/desktop-release-gates.yml"
  workflow_dispatch: {}

# No secrets are used. Least-privilege token.
permissions:
  contents: read

# Cancel superseded runs on the same PR to save runner minutes.
concurrency:
  group: desktop-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-release-gates:
    # macOS is required: electron-builder produces the mac .app bundles and the
    # packaged Electron smoke launches a real GUI app (GitHub macOS runners are
    # GUI-capable). macos-14 = Apple Silicon (arm64), the primary v1 target.
    runs-on: macos-14
    timeout-minutes: 40
    env:
      # Belt-and-braces: the packaged-smoke wrapper enforces strict crash
      # attribution + a 30s settle floor when CI=true; make CI explicit and keep
      # the strict guard ON (never disabled in CI).
      LAWBAR_CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lawbar-desktop/package-lock.json

      - name: Install desktop deps (committed internal tarballs; no bootstrap rebuild, no signing)
        run: npm --prefix apps/lawbar-desktop ci

      # This job installs the COMMITTED tarballs rather than rebuilding them, so if
      # case-box-contract / case-box-persistence source has moved without a repack, every
      # step below would pass green against a stale build. That is not hypothetical: the
      # tarballs drifted 14 files behind source between 2026-08-05 and 2026-08-11 and
      # nothing reported it. Fix on failure:
      #   npm --prefix apps/lawbar-desktop run bootstrap
      # then commit dist-tarballs/ + package-lock.json.
      # The tarball guard below compares the committed tarballs against a FRESH PACK OF
      # SOURCE. `dist/` is gitignored, so on a clean CI checkout there is nothing compiled to
      # pack and every payload file reads as "EXTRA". That made the guard pass on any machine
      # where someone had built recently and fail on every clean one — it has in fact never
      # passed in CI, because the step was added after this workflow's last green run and
      # this PR is its first execution. Build first, then compare.
      - name: Build the internal packages the tarballs are packed from
        run: |
          npm --prefix docs/contracts/case-box-contract ci
          npm --prefix docs/contracts/case-box-contract run build
          npm --prefix services/case-box-persistence ci
          npm --prefix services/case-box-persistence run build

      - name: Internal tarballs match current source (else the suite below tests stale code)
        run: |
          npm --prefix apps/lawbar-desktop run check:internal-tarballs
          npm --prefix apps/lawbar-desktop run check:internal-lock

      - name: Unit + renderer + electron suite (includes the i18n user-facing-English guard)
        run: npm --prefix apps/lawbar-desktop test

      # THE ORACLE THAT THE PACKAGED STEPS BELOW DEPEND ON.
      # Every packaged step in this job runs inside scripts/test-packaged-wrapper.mjs, a fail-closed
      # crash detector: it parses macOS .ips reports, attributes crashes to the app, and exits 3 on
      # an attributable crash / 2 on a CI-guard violation / 4 on unreadable diagnostics. The comment
      # at the top of this job asserts that wrapper "enforces strict crash attribution + a 30s settle
      # floor when CI=true" — but until now nothing in CI proved that enforcement still worked. A
      # wrapper that silently stopped detecting would let the packaged smoke matrix report green
      # while checking nothing, which is precisely the "test that cannot fail" failure mode this
      # repo treats as its recurring one.
      #
      # wrapper.test.mjs is pure Node — no Electron, no Playwright, no packaged build. It drives the
      # wrapper via spawnSync against synthetic .ips fixtures in a temp dir and asserts its exit
      # codes across the G2.4.a-h attribution matrix and the G2.8 CI-guard cases (STRICT_UNATTRIBUTED
      # cannot be disabled under CI; the settle floor cannot drop below 30s; a sentinel fires when the
      # wrapper's own instrumentation is missing). Measured 2026-08-29: 31 tests, 31 pass, ~15s.
      #
      # WHAT THIS STEP LETS CI CLAIM: the packaged crash-detection oracle's CI invariants are
      # enforced before merge. Without it, every packaged result below is unverified at its root.
      # It runs BEFORE the packaged steps deliberately — a broken oracle should fail fast, not after
      # a 10-minute build.
      - name: Packaged-test crash oracle invariants (pure Node; gates the packaged steps below)
        run: npm --prefix apps/lawbar-desktop run test:wrapper

      - name: Package the app (UNSIGNED — identity:null; NO signing/notarization in CI)
        run: npm --prefix apps/lawbar-desktop run dist

      - name: Packaged release smoke matrix (M1-M9) against the fresh build
        run: npm --prefix apps/lawbar-desktop run test:smoke-matrix

      # Substantiates the closure of deferred audit finding LINK-IPC-T1-D1. That finding was closed
      # on evidence this test produces; running it only locally makes the closure a dated historical
      # verification rather than a regression-enforced property. For a court-facing release gate the
      # difference matters: "was verified once" and "cannot regress" are different claims, and the
      # readiness framework reads as the second.
      #
      # Marginal cost only — `dist` above already built the bundle. Measured 2026-08-29 against a
      # packaged build: 2 tests, 2 pass, ~3s of assertions plus the wrapper's mandatory 30s settle.
      #
      # WHAT THIS STEP LETS CI CLAIM: the A3 packaged link round-trip closure is regression-enforced,
      # not merely recorded.
      - name: A3 packaged link round-trip (regression-enforces the LINK-IPC-T1-D1 closure)
        run: npm --prefix apps/lawbar-desktop run test:link-roundtrip-packaged

      # DELIBERATELY NOT RUN HERE, and this is a risk acceptance rather than a judgement that these
      # surfaces are redundant:
      #   test:packaged      — packaged-binary smoke (3 tests)
      #   test:ipc-packaged  — renderer<->main case-box IPC, packaged (1 test)
      #   test:tarball-poc   — packaged tarball proof (7 tests)
      # Each needs the full packaged bundle plus its own 30s settle, and no current release claim
      # depends on their CONTINUOUS enforcement. Revisit if a gate ever cites one of them as
      # standing evidence. They remain runnable on demand via their npm scripts.
      #
      # `release-signing-real-bundle` stays unbound to any trigger BY DESIGN — spctl/xcrun stapler
      # may perform an online notarization lookup and gated tests here must not touch the network.
      # See its lane description in .claude/tdd-guardian/config.json. Do not "fix" that empty gateOn.

      # Generated release/** artifacts are NOT uploaded or committed (300 MB+ per
      # bundle, gitignored). This job proves the release path builds + smokes; it
      # does not publish artifacts.
