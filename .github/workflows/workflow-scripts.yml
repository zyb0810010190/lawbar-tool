name: Workflow scripts

# CI gate for the repo-workflow shell in `scripts/` — the machinery that decides whether
# two-sided verification is real — AND the documentation-reference ratchet itself.
#
# CORRECTED 2026-08-24. This header already claimed it gated "the documentation-reference
# ratchet". It did not. Its only step ran that ratchet's TESTS, and a passing test proves the
# ratchet works, not that it was applied — so a dead documentation reference merged unnoticed.
# The job made a false claim about itself, in the layer this project treats as its only
# enforcement boundary.
#
# The paths filter was the other half of the same defect. The ratchet scans `docs/`, so a
# docs-only PR did not match `scripts/**` and the job never ran at all. And it can break a
# second way the filter could never catch: a source file is deleted or renamed, and a backticked
# reference to it in an untouched document goes dead. Both paths need it to run unconditionally,
# which is why there is no `paths:` filter below. The cost is seconds — no install step, pure
# node — and it is what makes the claim above true without qualification.
#
# Why this exists: those 75 tests were registered only in the local tdd-guardian lane, which
# is visibility, not enforcement. Two of the three test files in `scripts/` had previously sat
# unregistered and unrun for an unknown period — `refresh-internal-lock-integrity.test.mjs`
# and `check-doc-references.test.mjs`, 46 passing tests protecting nothing. Discovery is by a
# RECURSIVE glob for the same reason: a hand-maintained list is how they went dark, and
# `scripts/**` cannot forget a new file or a new directory.
#
# No install step: every test imports only node: builtins and local modules. The only external
# command they need is `git` (the baseline tests build throwaway repos), which the runner has.
#
# Merge posture: required for merge BY POLICY (do not merge on a red run), but technically
# advisory — this repo lacks enforceable branch protection / required status checks, because
# it is a private repo under the current account and that plan does not offer them. Nothing
# mechanically blocks a merge on red; the policy is the only thing holding. Mirrors the
# desktop-release-gates and services-ci posture.

on:
  # NO paths filter, deliberately — see the header. A docs-only PR must run the ratchet, and so
  # must a PR that deletes a file some document references.
  pull_request:
  workflow_dispatch: {}

# No secrets are used. Least-privilege token.
permissions:
  contents: read

# Cancel superseded runs on the same PR to save runner minutes.
concurrency:
  group: workflow-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    # Linux is sufficient: headless Node plus git. The one macOS-only concern is that
    # `wi-baseline.sh` targets bash 3.2 (the macOS system shell); ubuntu's bash is newer, so
    # this job proves BEHAVIOUR, not 3.2 syntax compatibility. That is checked locally with
    # `/bin/bash -n` and is called out here so the gap is not mistaken for coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The baseline tests run `git archive`/`git ls-tree` against real history, so the
          # full history is needed rather than a shallow clone.
          fetch-depth: 0
          # This job executes PR-controlled test code. Don't leave the checkout token in
          # .git/config while that runs.
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # git identity: the baseline tests create throwaway repos and commit into them.
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"

      - name: Workflow script suites
        run: node --test 'scripts/**/*.test.mjs'

      # THE RATCHET ITSELF, not its tests. Exits non-zero when the count of dead backticked
      # references rises above the committed baseline. Runs after the suites so a broken ratchet
      # is reported as a broken ratchet rather than as a documentation failure.
      - name: Documentation-reference ratchet
        run: node scripts/docs/check-doc-references.mjs
