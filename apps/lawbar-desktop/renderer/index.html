<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>lawbar</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="lawbar-app">
    <!--
      Desktop shell (PR1 + WI-i18n-2). Ported from dev-memo/design-source/desktop-shell.css.
      Chrome strings are now i18n-driven (WI-i18n-2): elements carry data-i18n / data-i18n-aria
      keys and renderer/index.ts populates their text + aria-label from the zh-CN catalog at
      bootstrap (English -> zh-CN drift-closure per plan-i18n-00 §6.5). No literal chrome copy here.
      The Electron window is framed, so the titlebar traffic-lights are decorative placeholders.
      The router still mounts the product screens flat into <main id="app">. No <h1> in the chrome.
    -->
    <div class="app-window">
      <div class="app-titlebar">
        <span class="traffic-lights" aria-hidden="true">
          <span class="traffic-light traffic-light--close"></span>
          <span class="traffic-light traffic-light--min"></span>
          <span class="traffic-light traffic-light--max"></span>
        </span>
        <span class="titlebar-crumb" data-i18n="shell.brand"></span>
        <span class="titlebar-spacer"></span>
      </div>

      <div class="app-shell">
        <aside class="app-sidebar" data-i18n-aria="shell.ariaPrimary">
          <div class="workspace-card" aria-hidden="true">
            <span class="workspace-glyph">L</span>
            <span class="workspace-body">
              <span class="workspace-kind" data-i18n="shell.workspaceKind"></span>
              <span class="workspace-name" data-i18n="shell.workspaceName"></span>
            </span>
          </div>

          <div class="sidebar-divider"></div>

          <nav class="sidebar-nav" data-i18n-aria="shell.ariaCaseBox">
            <!-- aria-current is set dynamically from the hash route by
                 renderer/nav.ts (UISHELL-L1); not hardcoded. -->
            <a class="sidebar-link" href="#/matters" data-nav="list">
              <span class="link-icon" aria-hidden="true">§</span>
              <span data-i18n="shell.navMatters"></span>
            </a>
            <a class="sidebar-link" href="#/matters/new" data-nav="new">
              <span class="link-icon" aria-hidden="true">+</span>
              <span data-i18n="shell.navNewMatter"></span>
            </a>
            <a class="sidebar-link" href="#/backup" data-nav="backup">
              <span class="link-icon" aria-hidden="true">↧</span>
              <span data-i18n="shell.navBackup"></span>
            </a>
            <a class="sidebar-link" href="#/settings" data-nav="settings">
              <span class="link-icon" aria-hidden="true">⚙</span>
              <span data-i18n="shell.navSettings"></span>
            </a>
          </nav>

          <div class="sidebar-footer">
            <span class="footer-status" data-i18n="shell.footerStatus"></span>
          </div>
        </aside>

        <div class="app-main">
          <div class="main-scroll">
            <main id="app" data-i18n-aria="shell.ariaApp"></main>
          </div>
        </div>
      </div>

      <div class="app-statusbar">
        <span class="status-dot" aria-hidden="true"></span>
        <span data-i18n="shell.statusbarLabel"></span>
        <span class="spacer"></span>
        <span data-i18n="shell.statusbarNote"></span>
      </div>
    </div>

    <div id="sr-announce" role="status" aria-live="polite" class="visually-hidden"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
